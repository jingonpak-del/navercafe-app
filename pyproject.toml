[project]
name = "navercafe-app"
version = "0.1.0"
description = "Reusable Naver Cafe crawling, marketing analysis, and operation automation modules"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "beautifulsoup4>=4.12",
    "requests>=2.31",
    "selenium>=4.20",
    "gspread>=6.0",
    "google-auth>=2.0",
    "PyYAML>=6.0",
    "kiwipiepy>=0.23.0",
]

[project.optional-dependencies]
excel = ["pandas>=2.0", "openpyxl>=3.1"]
login = ["undetected-chromedriver>=3.5", "pyperclip>=1.8", "curl-cffi>=0.7"]
dev = ["pytest>=8.0", "ruff>=0.5"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
